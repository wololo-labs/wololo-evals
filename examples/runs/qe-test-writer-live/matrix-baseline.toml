# The baseline arm: the same model on the same cases with no skill installed.
#
# It has to be the same engine and model as the candidate, or the comparison
# measures the model rather than the pack. The only difference between the two
# configs is the absence of an [[assets]] block.
schema_version = "2.0.0"
benchmark = "../../../benchmarks/qe-skill"
output_dir = "out/baseline"
fixtures_dir = "../../fixtures/quoting-service"
expected_skill = "test-writer-fixer"
seeds = 1
max_cost_usd = 12.0

[engines.claude]
version_range = ">=2.0.24,<3"

[[models]]
id = "claude-sonnet-5"
engine = "claude"
model = "claude-sonnet-5"

[[prompts]]
id = "qe-skill"
