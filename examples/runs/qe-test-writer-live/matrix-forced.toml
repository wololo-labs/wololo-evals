# The forced arm: the same pack, told to use the skill.
#
# The natural candidate arm scores two things at once, the skill's contents and
# whether the model routes to it, and on this casebook the second is always no:
# asked for pytest tests over a small conventional service, the model writes
# them unaided and never invokes the skill. That makes the natural arm unable
# to say anything about the instructions inside the skill.
#
# This arm names the skill in a preamble so the instructions are what gets
# scored. Routing is then reported separately, as its own number, from the
# natural arm's activation rate.
#
# The preamble is a real confound and is not pretended away: naming a testing
# skill also nudges the model toward testing. It is the price of separating the
# two questions, and the README next to the published report says so.
schema_version = "2.0.0"
benchmark = "../../../benchmarks/qe-skill"
output_dir = "out/forced"
fixtures_dir = "../../fixtures/quoting-service"
expected_skill = "test-writer-fixer"
prompt_preamble = "Use the test-writer-fixer skill for this task."
seeds = 1
max_cost_usd = 12.0

[engines.claude]
version_range = ">=2.0,<3"

[[models]]
id = "claude-sonnet-5"
engine = "claude"
model = "claude-sonnet-5"

[[prompts]]
id = "qe-skill"

[[assets]]
id = "test-writer-pack"
kind = "agent_skill"
path = "../../../../ainb-toolkit/packages/test-writer-pack/.apm/skills"
