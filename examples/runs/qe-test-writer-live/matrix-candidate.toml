# The candidate arm: test-writer-pack, run live against the quoting fixture.
#
# Unlike the recorded corpus next door, this arm calls a real model. Every case
# starts from a pristine copy of the fixture (`fixtures_dir`), the pack's skill
# is mounted where the CLI discovers project skills, and the suite the run
# leaves behind in `tests_generated/` is what the QE scorers measure.
#
# `assets.path` reaches into a sibling checkout of the toolkit rather than a
# copy vendored here: the score has to attach to the package the catalogue
# installs, not to a duplicate of it that can drift. Clone the two repositories
# side by side:
#
#   git clone https://github.com/stevengonsalvez/ainb-toolkit ../ainb-toolkit
#   wololo-evals-cli matrix --config examples/runs/qe-test-writer-live/matrix-candidate.toml
#
# Spend: one model turn per case, twelve cases, one seed. `max_cost_usd` stops
# the run rather than trusting an estimate.
schema_version = "2.0.0"
benchmark = "../../../benchmarks/qe-skill"
output_dir = "out/candidate"
fixtures_dir = "../../fixtures/quoting-service"
expected_skill = "test-writer-fixer"
seeds = 1
max_cost_usd = 12.0

[engines.claude]
version_range = ">=2.0,<3"

[[models]]
id = "claude-sonnet-5"
engine = "claude"
model = "claude-sonnet-5"

[[prompts]]
id = "qe-skill"

[[assets]]
id = "test-writer-pack"
kind = "agent_skill"
path = "../../../../ainb-toolkit/packages/test-writer-pack/.apm/skills"
