# INSTRUMENT VALIDATION, replication. Not an asset score, never a badge.
#
# Calibration of the three new cases on the no-skill control ALONE. A new case
# is invalid if this control catches more than half of the six seeded defects
# on it (rule fixed in benchmarks/qe-skill-iii/cases.toml before any run). This
# run decides validity and is then discarded: the analysis measures the control
# again fresh, so the cases are not selected on the outcome being compared.
schema_version = "2.0.0"
benchmark = "../../../benchmarks/qe-skill-iii"
output_dir = "out/calib"
fixtures_dir = "../../fixtures/skerry-codec"
expected_skill = "skerry-frame-testing"
seeds = 1
only_cases = ["qe3-05-consumer-contract", "qe3-06-gap-review", "qe3-07-find-the-bugs"]
max_cost_usd = 1.8

[engines.claude]
version_range = ">=2.0,<3"

[[models]]
id = "claude-sonnet-5"
engine = "claude"
model = "claude-sonnet-5"

[[prompts]]
id = "qe-skill-iii"
