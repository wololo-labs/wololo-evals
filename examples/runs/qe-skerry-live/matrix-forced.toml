# INSTRUMENT VALIDATION. Not an asset score, and never a catalogue badge.
#
# Arm: skill installed and named in the prompt. Scores the skill's knowledge separately from whether the model routes to it.
#
# One frontier model on every arm, workspaces sealed from the host repository,
# answer key withheld from the workspace. The fixture is an invented protocol
# the model cannot know, so any difference between arms is the skill's
# knowledge and not the model's.
schema_version = "2.0.0"
benchmark = "../../../benchmarks/qe-skill-iii"
output_dir = "out/forced"
fixtures_dir = "../../fixtures/skerry-codec"
expected_skill = "skerry-frame-testing"
prompt_preamble = "Use the skerry-frame-testing skill for this task."
seeds = 1
max_cost_usd = 1.6

[engines.claude]
version_range = ">=2.0.24,<3"

[[models]]
id = "claude-sonnet-5"
engine = "claude"
model = "claude-sonnet-5"

[[prompts]]
id = "qe-skill-iii"

[[assets]]
id = "skerry-frame-testing"
kind = "agent_skill"
path = "../../../benchmarks/qe-skill-iii/skill"
