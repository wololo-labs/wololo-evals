name: Bug report
description: Report a reproducible problem.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private URLs, or evaluation data.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest command or code sample that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
