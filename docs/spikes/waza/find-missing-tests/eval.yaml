# waza front-half spike: eval for the find-missing-tests skill (ainb-toolkit QE pack).
# ISOLATION: the skill body tells the agent to run `gh issue create`, so this eval must run through
# run-isolated.sh next to this file. That script removes GH_TOKEN and GITHUB_TOKEN and points GH_CONFIG_DIR
# at an empty directory, so the gh CLI has no credential. Not covered: Copilot's GitHub MCP tools, which a
# skill cannot restrict (no tool allow-list for skills). Running `waza run` on this file directly drops the isolation.
# Run from the repo root once Copilot auth works (see docs/spikes/waza-front-half.md).
name: find-missing-tests-eval
description: Spike eval for find-missing-tests. Trigger accuracy lives in trigger_tests.yaml next to this file.
skill: find-missing-tests
schemaVersion: "1.0"
version: "1.0"

config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-5.5
  # Relative to the spec dir. Copy of the ainb-toolkit skill with its em-dashes replaced (the only change).
  skill_directories:
    - skills

metrics:
  - name: gap_list_produced
    weight: 1.0
    threshold: 0.8
    description: The run names at least one missing test case.

graders:
  # A real gap list: at least one bullet or numbered item that mentions a test, and no "no missing tests" answer.
  # Plain "missing test" matched the mock executor's echoed prompt, so it proved nothing.
  - type: text
    name: lists_a_missing_test
    config:
      regex_match:
        - "(?im)^\\s*(?:[-*]|\\d+[.)])\\s+.*\\btest"
      regex_not_match:
        - "(?i)no (missing )?(tests|test cases|gaps)"

tasks:
  - tasks/*.yaml
