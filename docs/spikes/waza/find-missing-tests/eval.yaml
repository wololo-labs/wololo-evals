# waza front-half spike: eval for the find-missing-tests skill (ainb-toolkit QE pack).
# Run from the repo root once Copilot auth works (see docs/spikes/waza-front-half.md).
name: find-missing-tests-eval
description: Spike eval for find-missing-tests. Trigger accuracy lives in trigger_tests.yaml next to this file.
skill: find-missing-tests
schemaVersion: "1.0"
version: "1.0"

config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-5.5
  # Relative to the spec dir. Byte-identical copy of the ainb-toolkit skill (check with cmp).
  skill_directories:
    - skills
  # Trigger-precision mode: keep skill discovery, do not inject the SKILL.md body.
  inject_skill_body: false

metrics:
  - name: gap_list_produced
    weight: 1.0
    threshold: 0.8
    description: The run names at least one missing test case.

graders:
  - type: text
    name: names_a_missing_test
    config:
      regex_match:
        - "(?i)missing test"

tasks:
  - tasks/*.yaml
