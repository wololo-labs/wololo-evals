# NOT RUNNABLE AS PUBLISHED. The agent file test-engineer.agent.md has a `tools:` line that waza cannot parse,
# so the agent does not load. On Copilot the with-agent arm then runs exactly like the baseline, and both arms
# pass silently. Do not read any result from this spec. The line stays unchanged by decision: a test of the agent
# must use it as its authors wrote it. Run this spec only after the asset parses, or after the decision changes.
#
# waza front-half spike, Q4: with/without A/B for the test-engineer agent on one QE task.
# Run: waza run docs/spikes/waza/test-engineer/eval.yaml --baseline --trials 3 --keep-workspace
name: test-engineer-ab
description: A/B for the test-engineer agent on the quoting-service weight boundary. Pass threshold is the mutation kill rate from grade_kill_rate.py.
skill: test-engineer
schemaVersion: "1.0"
version: "1.0"

config:
  trials_per_task: 3
  timeout_seconds: 600
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-5.5
  # Relative to the spec dir. Holds only test-engineer.agent.md, a copy of the ainb-toolkit file with its em-dashes replaced (the only change).
  # Sharing the ainb-toolkit agents dir failed the with-skills arm once (playwright-test-generator.agent.md); cause not established.
  skill_directories:
    - agents

metrics:
  - name: mutation_kill_rate
    weight: 1.0
    threshold: 0.24
    description: Share of seeded mutants the generated suite kills (qe-target.json mutation_threshold).

graders:
  - type: program
    name: mutation_kill_rate
    config:
      # Run waza from the repo root. uv resolves the repo's pyproject with the mutation extra, so no box-specific interpreter.
      # Program-grader args resolve against the waza working directory, not the spec dir (waza sets no cwd for graders).
      command: uv
      args: ["run", "--project", ".", "--extra", "mutation", "python", "docs/spikes/waza/test-engineer/grade_kill_rate.py"]
      timeout: 900

tasks:
  - tasks/*.yaml
