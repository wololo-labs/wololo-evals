[project]
name = "wololo-evals"
version = "0.1.0"
description = "Quality gate for Wololo OS: eval execution service wrapping Inspect AI (proprietary; specs/ publish Apache-2.0)"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "PyJWT>=2.9",
    "jsonschema>=4.21",
    "PyYAML>=6",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-api>=1.27",
    "inspect-ai>=0.3.100",
]

[project.scripts]
wololo-evals-cli = "wololo_evals.cli.main:main"

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "asgi-lifespan>=2.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "compose: real containerized integration trial; needs a docker daemon + a model API key, skipped loudly otherwise (SPEC S14 rung 2)",
]
