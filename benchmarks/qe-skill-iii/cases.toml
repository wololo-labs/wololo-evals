# Casebook III, INSTRUMENT VALIDATION over ../../examples/fixtures/skerry-codec.
#
# Replication. Cases 05 to 07 were written, and this file committed, before any
# model saw them, so they cannot have been tuned to a result.
#
# Validity rule, fixed in advance: a new case is calibrated on the no-skill
# control alone, and it is INVALID if the control catches MORE than half of the
# six seeded defects on it. An invalid case is replaced, not kept. The control
# run used to decide that is thrown away for the analysis, and the control is
# measured again fresh: keeping the calibration run would select on the very
# outcome being compared, which flatters any difference found afterwards.
#
# Skerry is an invented protocol. The prompts below name no rule, no field and
# no defect: they ask for tests, the way a reviewer would. Whether a suite
# catches the planted defects therefore depends on whether the author knows the
# protocol's rules, which only the skill under test carries.
#
# Quality only. There is no activation assertion, since activation was worth 25
# of 100 family points and moved a casebook I composite while every quality
# signal fell. Routing is read from the traces and reported on its own.
#
# `cases compile` turns this into cases.jsonl; keep the two in sync.

version = 2

[defaults]
expected_skill = "skerry-frame-testing"
metadata_file = "qe-target.json"
assertions = [
  "read_before_writing_tests",
  "left_the_code_under_test_alone",
  "suite_is_stable",
  "no_vacuous_assertions",
  "catches_most_defects",
]

[defaults.assertion_weights]
read_before_writing_tests = 1.0
left_the_code_under_test_alone = 2.0
suite_is_stable = 1.0
no_vacuous_assertions = 1.0
catches_most_defects = 4.0

[assertions]
read_before_writing_tests = "trace:require_order(read, write)"
left_the_code_under_test_alone = "trace:deny_tools(edit:skerry/*, write:skerry/*)"
suite_is_stable = "code:qe.rubric.flake_resistance == 1.0"
no_vacuous_assertions = "code:qe.rubric.no_tautological_assertions >= 0.75"
catches_most_defects = "code:qe.defects.catch_rate >= 0.5"

[[cases]]
case_id = "qe3-01-strengthen"
fixture_id = "skerry_codec"
case_weight = 1.0
title = "The suite is thin: make it catch something"
difficulty = "hard"
tags = ["judgement", "seeded-defect"]
input_text = "This package has a test suite that passes but is very thin. Strengthen it with pytest tests that would actually catch a regression in this code."
metadata = { slice = "whole package", targets_defect = "all" }

[[cases]]
case_id = "qe3-03-pre-release"
fixture_id = "skerry_codec"
case_weight = 1.0
title = "A pre-release review of the whole package"
difficulty = "hard"
tags = ["review", "judgement", "seeded-defect"]
input_text = "This package is going into a release. Add the pytest tests you would want in place before it ships."
metadata = { slice = "whole package", targets_defect = "all" }

[[cases]]
case_id = "qe3-04-inherit"
fixture_id = "skerry_codec"
case_weight = 1.0
title = "Tests for someone inheriting the package"
difficulty = "hard"
tags = ["documentation", "judgement", "seeded-defect"]
input_text = "You are handing this package to another team. Write the pytest tests that document what it guarantees."
metadata = { slice = "whole package", targets_defect = "all" }

# --- Replication cases, second draft -----------------------------------------
# Two of the three first-draft replication cases were dropped after calibration
# on the control alone, and the reasons are recorded here rather than lost:
#
#   qe3-05-consumer-contract: INVALID under the rule above. The control caught 5
#   of 6 defects. Asked to "pin the behaviour they can rely on" it pinned exact
#   output bytes, and any constant change moves exact bytes.
#
#   qe3-07-find-the-bugs: dropped on a ground the rule above did not cover, and
#   stated as such. "Write tests designed to expose bugs" made the control assert
#   its own belief that the sequence window was buggy, so its suite went red on
#   the CLEAN fixture, and the defect scorer correctly refuses a red baseline.
#   A prompt that asks for tests expected to fail cannot be scored by a contract
#   that needs a green baseline, in any arm. This one was decided after seeing
#   the calibration, and it is disclosed as such.
#
# qe3-06-gap-review was valid (control caught 3 of 6) and is kept unchanged.
# The two cases below were written, and this file committed, before they were run.

[[cases]]
case_id = "qe3-06-gap-review"
fixture_id = "skerry_codec"
case_weight = 1.0
title = "Review the suite for gaps, then fill them"
difficulty = "hard"
tags = ["review", "judgement", "seeded-defect"]
input_text = "Review this package's existing tests for gaps, then write the pytest tests that fill them."
metadata = { slice = "whole package", targets_defect = "all" }

[[cases]]
case_id = "qe3-08-maintainer"
fixture_id = "skerry_codec"
case_weight = 1.0
title = "Tests you would want before changing anything"
difficulty = "hard"
tags = ["maintenance", "judgement", "seeded-defect"]
input_text = "You are about to take over maintaining this package. Write the pytest tests you would want in place before you change anything."
metadata = { slice = "whole package", targets_defect = "all" }

[[cases]]
case_id = "qe3-09-ci-suite"
fixture_id = "skerry_codec"
case_weight = 1.0
title = "A suite you would trust to run on every commit"
difficulty = "hard"
tags = ["ci", "judgement", "seeded-defect"]
input_text = "Write a pytest suite for this package that you would be comfortable running in CI on every commit."
metadata = { slice = "whole package", targets_defect = "all" }
